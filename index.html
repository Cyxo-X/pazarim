<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pazarım</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root{
    --navy:#0F2D4D; --navy-dark:#0A2138; --navy-light:#164470;
    --amber:#F2A33E; --amber-dark:#DE8A1E;
    --bg:#F5F4EF; --surface:#ffffff; --text:#141F2C; --muted:#68788A; --border:#E6E3D9;
    --green:#1F6B53; --red:#B23A3A; --blue:#1D5FA8;
  }
  body.dark-mode{
    --bg:#0B1620; --surface:#132436; --text:#E9EEF3; --muted:#93A6B8; --border:#22374B;
  }
  body{transition:background-color .25s ease, color .25s ease;}
  body.dark-mode .card, body.dark-mode .value, body.dark-mode .review-item, body.dark-mode .review-form,
  body.dark-mode .checkout-panel, body.dark-mode .checkout-summary, body.dark-mode .order-card,
  body.dark-mode .filter-bar, body.dark-mode .admin-wrap, body.dark-mode .modal, body.dark-mode .side-drawer,
  body.dark-mode .drawer, body.dark-mode .lang-menu, body.dark-mode .account-menu, body.dark-mode nav.catnav,
  body.dark-mode .admin-login-wrap{
    box-shadow:0 4px 18px rgba(0,0,0,0.35);
  }
  body.dark-mode .fav-btn{border-color:var(--border);}
  body.dark-mode .searchbar input::placeholder{color:var(--muted);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}

  body.admin-mode .topbar, body.admin-mode nav.catnav, body.admin-mode .trust, body.admin-mode .newsletter, body.admin-mode footer{display:none;}
  body.admin-mode .searchbar, body.admin-mode .delivery{visibility:hidden;}

  /* topbar */
  .topbar{background:var(--navy-dark);color:#C9D8E5;font-size:12.5px;padding:7px 0;}
  .topbar .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
  .topbar-left{display:flex;align-items:center;gap:6px;}
  .topbar-right{display:flex;gap:18px;align-items:center;}
  .topbar-right span{cursor:pointer;transition:color .15s;}
  .topbar-right span:hover{color:#fff;}

  .lang{position:relative;}
  .lang-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);border-radius:20px;color:#fff;padding:4px 11px;cursor:pointer;font-size:12px;}
  .lang-btn:hover{background:rgba(255,255,255,0.12);}
  .lang-menu{display:none;position:absolute;top:130%;right:0;background:var(--surface);border-radius:12px;box-shadow:0 12px 32px rgba(10,33,56,0.25);overflow:hidden;z-index:150;min-width:160px;}
  .lang-menu.open{display:block;}
  .lang-item{padding:11px 15px;display:flex;align-items:center;gap:9px;cursor:pointer;color:var(--text);font-size:13.5px;}
  .lang-item:hover{background:var(--bg);}
  .lang-item.active{background:#FDF3E4;font-weight:700;color:var(--amber-dark);}

  /* header */
  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);padding:16px 0;position:sticky;top:0;z-index:60;box-shadow:0 2px 12px rgba(10,33,56,0.15);}
  header .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .menu-btn{background:rgba(255,255,255,0.08);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;transition:background .15s;flex-shrink:0;}
  .menu-btn:hover{background:rgba(255,255,255,0.16);}

  .logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0;}
  .logo-mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,#F6B65C,var(--amber-dark));display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(222,138,30,0.4);}
  .logo-word{color:#fff;font-size:23px;font-weight:800;letter-spacing:-0.7px;}
  .logo-word .dot{color:var(--amber);}

  .delivery{display:flex;align-items:center;gap:7px;color:#DCE6EF;font-size:13px;white-space:nowrap;cursor:pointer;}
  .delivery .sub{color:#8FA7BE;font-size:11px;}
  .delivery .main{font-weight:600;color:#fff;}

  .searchbar{flex:1;min-width:220px;display:flex;background:var(--surface);border-radius:26px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
  .searchbar input{flex:1;border:none;outline:none;padding:11px 20px;font-size:14px;}
  .searchbar button{background:var(--amber);border:none;padding:0 20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .searchbar button:hover{background:var(--amber-dark);}

  .headicons{display:flex;align-items:center;gap:22px;color:#fff;}
  .headicon{display:flex;flex-direction:column;align-items:center;font-size:11.5px;cursor:pointer;position:relative;gap:2px;opacity:0.95;transition:opacity .15s;}
  .headicon:hover{opacity:1;}
  .cart-badge{position:absolute;top:-7px;right:-9px;background:var(--amber);color:var(--navy);border-radius:50%;width:17px;height:17px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .avatar{width:24px;height:24px;border-radius:50%;background:var(--amber);color:var(--navy-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}

  .account-wrap{position:relative;}
  .account-menu{display:none;position:absolute;top:130%;right:0;background:var(--surface);border-radius:14px;box-shadow:0 14px 34px rgba(10,33,56,0.25);overflow:hidden;z-index:150;min-width:210px;color:var(--text);}
  .account-menu.open{display:block;}
  .account-menu-head{padding:14px 16px;background:var(--bg);border-bottom:1px solid var(--border);}
  .account-menu-head .name{font-weight:700;font-size:14px;}
  .account-menu-head .email{font-size:12px;color:var(--muted);margin-top:2px;}
  .account-menu-item{padding:12px 16px;font-size:13.5px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .account-menu-item:hover{background:var(--bg);}
  .account-menu-item.danger{color:var(--red);}

  /* category nav */
  nav.catnav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:72px;z-index:55;}
  nav.catnav .wrap{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;}
  nav.catnav .wrap::-webkit-scrollbar{display:none;}
  .catitem{display:flex;align-items:center;gap:6px;padding:13px 0;font-size:13.5px;white-space:nowrap;cursor:pointer;color:#3A4B5C;border-bottom:2.5px solid transparent;transition:color .15s;font-weight:500;}
  .catitem:hover{color:var(--navy);}
  .catitem.active{color:var(--navy);font-weight:700;border-bottom:2.5px solid var(--amber);}

  /* side drawer */
  .side-drawer{position:fixed;top:0;left:0;height:100%;width:300px;background:var(--surface);z-index:200;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:8px 0 24px rgba(0,0,0,0.15);}
  .side-drawer.open{transform:translateX(0);}
  .side-drawer-head{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;padding:22px 20px;display:flex;align-items:center;justify-content:space-between;}
  .side-drawer-head .title{font-size:17px;font-weight:700;}
  .side-drawer-head button{background:rgba(255,255,255,0.12);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .side-drawer-body{flex:1;overflow-y:auto;padding:8px 0;}
  .side-section-label{padding:14px 20px 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);font-weight:700;}
  .side-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;font-size:14.5px;color:var(--text);transition:background .15s;}
  .side-item:hover{background:var(--bg);}
  .side-item.active{background:#FDF3E4;color:var(--amber-dark);font-weight:700;}
  .side-item .emoji{font-size:18px;width:24px;text-align:center;}

  .overlay{position:fixed;inset:0;background:rgba(10,33,56,0.45);z-index:190;display:none;backdrop-filter:blur(1px);}
  .overlay.open{display:block;}

  main{padding:28px 20px 70px;}

  /* hero */
  .hero{border-radius:20px;overflow:hidden;background:linear-gradient(120deg,var(--navy) 0%,#1B4E80 60%,#2A6B9C 100%);color:#fff;padding:44px 40px;margin-bottom:28px;position:relative;}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(242,163,62,0.35),transparent 70%);}
  .hero h1{font-size:32px;font-weight:800;margin:0 0 10px;max-width:520px;position:relative;}
  .hero p{font-size:15px;opacity:0.85;margin:0 0 20px;max-width:460px;position:relative;}
  .hero button{background:var(--amber);color:var(--navy-dark);border:none;border-radius:24px;padding:12px 26px;font-size:14px;font-weight:700;cursor:pointer;position:relative;transition:transform .15s;}
  .hero button:hover{transform:translateY(-2px);}

  /* promos */
  .promos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:32px;}
  .promo{border-radius:16px;padding:26px 24px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s;cursor:pointer;}
  .promo:hover{transform:translateY(-3px);}
  .promo h3{font-size:19px;font-weight:700;margin:0 0 6px;}
  .promo p{font-size:13.5px;opacity:0.85;margin:0;}
  .promo button{margin-top:14px;align-self:flex-start;background:#fff;border:none;border-radius:20px;padding:8px 18px;font-size:12.5px;font-weight:700;cursor:pointer;}

  /* value props */
  .values{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:40px;}
  .value{display:flex;gap:12px;align-items:center;background:var(--surface);padding:16px 18px;border-radius:14px;border:1px solid var(--border);transition:box-shadow .15s;}
  .value:hover{box-shadow:0 4px 14px rgba(15,45,77,0.08);}
  .value-icon{width:42px;height:42px;border-radius:11px;background:#EEF3F7;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .value .title{font-weight:700;font-size:13.5px;}
  .value .sub{font-size:12px;color:var(--muted);}

  /* home category sections */
  .cat-section{margin-bottom:44px;}
  .cat-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .cat-section-head .heading{display:flex;align-items:center;gap:10px;}
  .cat-section-head .emoji-badge{width:38px;height:38px;border-radius:11px;background:#EEF3F7;display:flex;align-items:center;justify-content:center;font-size:19px;}
  .cat-section-head h2{font-size:19px;font-weight:800;margin:0;}
  .see-all{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--navy);font-weight:700;cursor:pointer;background:none;border:none;padding:6px 4px;}
  .see-all:hover{color:var(--amber-dark);}

  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
  .section-head h2{font-size:22px;font-weight:800;margin:0;}
  .section-head .count{font-size:13px;color:var(--muted);}
  .breadcrumb{font-size:13px;color:var(--muted);margin-bottom:10px;}
  .breadcrumb span{cursor:pointer;color:var(--navy);font-weight:600;}
  .breadcrumb span:hover{text-decoration:underline;}

  /* products */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:16px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:relative;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;}
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(15,45,77,0.12);}
  .badge{position:absolute;top:12px;left:12px;color:#fff;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:20px;z-index:1;letter-spacing:0.2px;}
  .badge.new{background:var(--green);}
  .badge.discount{background:var(--red);}
  .badge.bestSeller{background:var(--amber-dark);}
  .fav-btn{position:absolute;top:10px;right:10px;background:var(--surface);border:1px solid var(--border);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;}
  .fav-btn.active{background:#FDEAEA;border-color:#F0C6C6;}
  .card-clickable{cursor:pointer;}
  .thumb{height:118px;border-radius:10px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;}
  .pname{font-size:13.5px;margin-bottom:7px;min-height:36px;font-weight:500;line-height:1.35;}
  .rating{display:flex;align-items:center;gap:4px;margin-bottom:9px;font-size:12px;color:var(--muted);}
  .rating .star{color:var(--amber);}
  .price{font-weight:800;font-size:17px;color:var(--navy);margin-bottom:11px;}
  .btn-add{margin-top:auto;background:var(--navy);color:#fff;border:none;border-radius:9px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;}
  .btn-add:hover{background:var(--navy-light);}
  .qty-row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:9px;padding:5px 10px;}
  .qty-row button{border:none;background:none;cursor:pointer;display:flex;padding:4px;}
  .qty-row span{font-weight:800;font-size:14px;}
  .empty-state{text-align:center;padding:70px 0;color:var(--muted);}

  .hscroll{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
  .hscroll::-webkit-scrollbar{display:none;}
  .hscroll .card{min-width:198px;flex-shrink:0;}

  .filter-bar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:20px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;}
  .filter-group{display:flex;align-items:center;gap:8px;font-size:13px;}
  .filter-group label{color:var(--muted);font-weight:600;}
  .filter-group select{border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;outline:none;background:var(--surface);}

  /* product detail */
  .product-detail{display:grid;grid-template-columns:340px 1fr;gap:32px;margin-bottom:44px;}
  .product-detail-media .thumb{height:320px;border-radius:18px;}
  .product-detail-media .thumb i{width:110px !important;height:110px !important;}
  .product-detail-info h1{font-size:26px;font-weight:800;margin:0 0 10px;}
  .price-lg{font-size:30px;font-weight:800;color:var(--navy);margin:12px 0;}
  .desc{font-size:14.5px;color:#3A4B5C;line-height:1.6;margin-bottom:22px;max-width:520px;}
  .qty-selector-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .qty-stepper{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:10px;padding:8px 14px;}
  .qty-stepper button{border:none;background:none;cursor:pointer;display:flex;}
  .qty-stepper span{font-weight:800;font-size:16px;min-width:20px;text-align:center;}
  .detail-add-btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:13px 26px;font-size:14.5px;font-weight:700;cursor:pointer;}
  .detail-add-btn:hover{background:var(--navy-light);}
  .detail-fav-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--text);}
  .detail-fav-btn.active{border-color:#F0C6C6;background:#FDEAEA;color:var(--red);}

  .reviews-section{margin-bottom:46px;}
  .reviews-section h2{font-size:20px;font-weight:800;margin-bottom:16px;}
  .review-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .review-item .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px;}
  .review-item .rname{font-weight:700;font-size:13.5px;}
  .review-item .rstars{color:var(--amber);font-size:13px;}
  .review-item .rcomment{font-size:13.5px;color:#3A4B5C;line-height:1.5;}
  .review-form{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:16px;}
  .star-picker{display:flex;gap:6px;margin-bottom:14px;}
  .star-picker span{font-size:24px;cursor:pointer;color:#D8D4C8;}
  .star-picker span.filled{color:var(--amber);}
  .review-form textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;min-height:80px;resize:vertical;margin-bottom:14px;}
  .login-prompt{background:var(--bg);border-radius:10px;padding:14px 16px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .login-prompt button{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;}

  /* checkout */
  .checkout-wrap{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start;}
  .step-indicator{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .step-dot{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);}
  .step-dot .num{width:26px;height:26px;border-radius:50%;background:var(--border);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
  .step-dot.active .num{background:var(--navy);}
  .step-dot.active{color:var(--navy);}
  .step-dot.done .num{background:var(--green);}
  .checkout-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px;}
  .checkout-panel h2{font-size:18px;font-weight:800;margin:0 0 18px;}
  .checkout-actions{display:flex;justify-content:space-between;margin-top:20px;gap:10px;}
  .checkout-actions button{flex:1;}
  .btn-secondary{background:none;border:1.5px solid var(--border);border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;color:var(--navy);}
  .btn-primary{background:var(--navy);color:#fff;border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-primary:hover{background:var(--navy-light);}
  .checkout-summary{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;position:sticky;top:150px;}
  .checkout-summary h3{font-size:15px;font-weight:800;margin:0 0 14px;}
  .summary-item{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;color:var(--muted);}
  .summary-total{border-top:1px solid var(--border);margin-top:10px;padding-top:10px;font-weight:800;font-size:15px;color:var(--navy);display:flex;justify-content:space-between;}
  .coupon-row{display:flex;gap:8px;margin:10px 0;}
  .coupon-row input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13px;outline:none;background:var(--surface);color:var(--text);}
  .coupon-row button{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .coupon-applied{display:flex;align-items:center;gap:8px;background:#E7F3EE;color:var(--green);border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:700;width:100%;}
  .coupon-applied button{margin-left:auto;background:none;border:none;color:var(--red);font-weight:700;cursor:pointer;font-size:12px;}
  .stock-note{font-size:11.5px;font-weight:700;margin-bottom:8px;}
  .stock-note.low{color:var(--amber-dark);}
  .stock-note.out{color:var(--red);}
  .summary-row{display:flex;justify-content:space-between;font-size:13px;margin:4px 0;color:#3A4B5C;}
  .radio-option{display:flex;align-items:center;gap:12px;border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer;}
  .radio-option.selected{border-color:var(--amber);background:#FFF8ED;}
  .radio-option input{width:18px;height:18px;}
  .confirm-box{text-align:center;padding:30px 10px;}
  .confirm-box .icon-circle{width:70px;height:70px;border-radius:50%;background:#E7F3EE;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .confirm-box h2{font-size:22px;font-weight:800;margin:0 0 8px;}
  .confirm-box p{color:var(--muted);font-size:14px;margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .field input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;transition:border-color .15s;}
  .field input:focus{border-color:var(--amber);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* orders */
  .order-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;}
  .order-card .ohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .order-card .oid{font-weight:800;font-size:14px;}
  .order-card .odate{font-size:12px;color:var(--muted);}
  .order-item-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #F1EFE8;color:#3A4B5C;}
  .order-total-row{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-top:10px;color:var(--navy);}
  .status-pill{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;display:inline-block;white-space:nowrap;}
  .status-pill.preparing{background:#FFF3E0;color:var(--amber-dark);}
  .status-pill.shipped{background:#E3EEFB;color:var(--blue);}
  .status-pill.delivered{background:#E7F3EE;color:var(--green);}
  .status-pill.cancelled{background:#FBEAEA;color:var(--red);}

  /* trust */
  .trust{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:20px 0;}
  .trust .wrap{display:flex;justify-content:center;gap:44px;flex-wrap:wrap;font-size:13px;color:#3A4B5C;font-weight:500;}
  .trust .item{display:flex;align-items:center;gap:9px;}

  /* newsletter */
  .newsletter{background:linear-gradient(120deg,var(--navy),var(--navy-light));color:#fff;padding:40px 20px;text-align:center;}
  .newsletter h3{font-size:22px;font-weight:800;margin:0 0 8px;}
  .newsletter p{font-size:14px;opacity:0.8;margin:0 0 20px;}
  .newsletter-form{display:flex;max-width:420px;margin:0 auto;gap:10px;flex-wrap:wrap;justify-content:center;}
  .newsletter-form input{flex:1;min-width:220px;border:none;border-radius:24px;padding:12px 18px;font-size:14px;outline:none;}
  .newsletter-form button{background:var(--amber);color:var(--navy-dark);border:none;border-radius:24px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer;}

  /* footer */
  footer{background:var(--navy-dark);color:#9DB2C6;padding:40px 20px 20px;}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:26px;font-size:13px;max-width:1240px;margin:0 auto;}
  .fgrid .col-title{color:#fff;font-weight:700;margin-bottom:12px;font-size:13.5px;}
  .fgrid div div{margin-bottom:8px;cursor:pointer;transition:color .15s;}
  .fgrid div div:hover{color:#fff;}
  .fbottom{max-width:1240px;margin:26px auto 0;border-top:1px solid #1B3A5C;padding-top:18px;font-size:12px;color:#6F87A0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .foot-logo{display:flex;align-items:center;gap:8px;}
  .admin-footer-link{opacity:0.5;cursor:pointer;transition:opacity .15s;}
  .admin-footer-link:hover{opacity:1;}

  /* cart drawer */
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(410px,100%);background:var(--surface);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,0.15);transform:translateX(100%);transition:transform .25s ease;z-index:200;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid var(--border);}
  .drawer-head h3{margin:0;font-size:18px;font-weight:800;}
  .drawer-head button{background:var(--bg);border:none;cursor:pointer;display:flex;width:32px;height:32px;border-radius:8px;align-items:center;justify-content:center;}
  .drawer-body{flex:1;overflow-y:auto;padding:10px 20px;}
  .cart-row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #F1EFE8;}
  .cart-row .thumb-sm{width:58px;height:58px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .cart-row .cname{font-size:13.5px;margin-bottom:4px;font-weight:500;}
  .cart-row .cprice{font-weight:800;font-size:14px;color:var(--navy);margin-bottom:7px;}
  .cart-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .qty-mini{display:flex;align-items:center;gap:9px;background:var(--bg);border-radius:8px;padding:3px 9px;}
  .qty-mini button{border:none;background:none;cursor:pointer;display:flex;padding:2px;}
  .remove-btn{border:none;background:none;cursor:pointer;display:flex;color:var(--red);font-size:12px;align-items:center;gap:4px;}
  .drawer-footer{border-top:1px solid var(--border);padding:18px 20px;}
  .row-between{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;}
  .row-between.small{font-size:13px;margin-bottom:16px;}
  .checkout-btn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;margin-bottom:9px;transition:background .15s;}
  .checkout-btn:hover{background:var(--navy-light);}
  .continue-btn{width:100%;background:none;border:1px solid var(--border);border-radius:12px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--navy);}

  /* modals */
  .modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.96);background:var(--surface);border-radius:18px;width:min(400px,92vw);z-index:210;box-shadow:0 24px 60px rgba(10,33,56,0.3);display:none;opacity:0;transition:opacity .18s, transform .18s;max-height:88vh;overflow-y:auto;}
  .modal.open{display:block;opacity:1;transform:translate(-50%,-50%) scale(1);}
  .modal-head{padding:22px 24px 0;}
  .modal-head-row{display:flex;justify-content:space-between;align-items:center;}
  .modal-head h2{font-size:20px;font-weight:800;margin:0;}
  .modal-close{background:var(--bg);border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .modal-body{padding:20px 24px 24px;}
  .tabs{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px;margin:16px 24px 0;}
  .tab-btn{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--muted);}
  .tab-btn.active{background:var(--surface);color:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,0.08);}
  .field-hint{font-size:11.5px;color:var(--muted);margin-top:5px;}
  .form-error{background:#FBEAEA;color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:9px;margin-bottom:14px;display:none;}
  .form-error.show{display:block;}
  .form-success{background:#E7F3EE;color:var(--green);font-size:12.5px;padding:9px 12px;border-radius:9px;margin-bottom:14px;display:none;}
  .form-success.show{display:block;}
  .submit-btn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:11px;padding:12.5px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:4px;transition:background .15s;}
  .submit-btn:hover{background:var(--navy-light);}
  .avatar-lg{width:56px;height:56px;border-radius:50%;background:var(--amber);color:var(--navy-dark);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;margin:0 auto 14px;}

  /* admin */
  .admin-wrap{display:grid;grid-template-columns:230px 1fr;gap:0;min-height:72vh;background:var(--surface);border-radius:18px;overflow:hidden;border:1px solid var(--border);box-shadow:0 8px 30px rgba(15,45,77,0.06);}
  .admin-sidebar{background:var(--navy-dark);color:#C9D8E5;padding:22px 0;}
  .admin-sidebar .brand{padding:0 20px 22px;font-weight:800;color:#fff;font-size:16px;display:flex;align-items:center;gap:9px;}
  .admin-nav-item{padding:12px 20px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;color:#B9C7D4;border-right:3px solid transparent;}
  .admin-nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .admin-nav-item.active{background:rgba(242,163,62,0.12);color:var(--amber);font-weight:700;border-right:3px solid var(--amber);}
  .admin-nav-item.exit{margin-top:18px;border-top:1px solid rgba(255,255,255,0.12);padding-top:16px;color:#E8A5A5;}
  .admin-content{padding:30px;overflow-x:auto;}
  .admin-content-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .admin-content-head h2{font-size:20px;font-weight:800;margin:0;}
  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:30px;}
  .stat-card{background:var(--bg);border-radius:14px;padding:18px;border:1px solid var(--border);display:flex;align-items:center;gap:14px;}
  .stat-card .stat-icon{width:42px;height:42px;border-radius:11px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stat-card .num{font-size:22px;font-weight:800;color:var(--navy);}
  .stat-card .lbl{font-size:12px;color:var(--muted);margin-top:2px;}
  .admin-table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  .admin-table th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;border-bottom:1.5px solid var(--border);}
  .admin-table td{padding:12px;border-bottom:1px solid #F1EFE8;vertical-align:middle;}
  .admin-table select{border:1.5px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12.5px;background:var(--surface);}
  .admin-empty{padding:60px 0;text-align:center;color:var(--muted);}
  .admin-login-wrap{max-width:380px;margin:60px auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px;text-align:center;}
  .admin-login-wrap .icon-circle{width:56px;height:56px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .admin-login-wrap h2{font-size:19px;font-weight:800;margin:0 0 6px;}
  .admin-login-wrap p{font-size:13px;color:var(--muted);margin:0 0 20px;}
  .admin-login-wrap .field{text-align:left;}
  .table-avatar{width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--navy-dark);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-right:8px;vertical-align:middle;}

  /* toast */
  .toast-container{position:fixed;bottom:22px;right:22px;z-index:400;display:flex;flex-direction:column;gap:10px;max-width:320px;}
  .toast{background:var(--navy-dark);color:#fff;padding:13px 18px;border-radius:11px;font-size:13.5px;box-shadow:0 12px 28px rgba(0,0,0,0.25);display:flex;align-items:center;gap:10px;animation:toastIn .2s ease;}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:800px){
    .checkout-wrap{grid-template-columns:1fr;}
    .checkout-summary{position:static;}
    .admin-wrap{grid-template-columns:1fr;}
    .admin-sidebar{display:flex;overflow-x:auto;padding:12px;gap:6px;}
    .admin-sidebar .brand{display:none;}
    .admin-nav-item{border-right:none;border-radius:8px;white-space:nowrap;}
    .admin-nav-item.exit{margin-top:0;border-top:none;padding-top:12px;}
  }
  @media (max-width:700px){
    .product-detail{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .hero{padding:32px 24px;}
    .hero h1{font-size:24px;}
    nav.catnav{top:64px;}
    .field-row{grid-template-columns:1fr;}
  }
</style>
</head>

function formatPrice(priceTRY){
  const l = LANGS[lang];
  const value = priceTRY * l.rate;
  const formatted = lang === "tr" ? value.toFixed(2).replace(".", ",") : value.toFixed(2);
  return lang === "tr" ? `${formatted}${l.currency}` : `${l.currency}${formatted}`;
}
function tr(key){ return LANGS[lang][key]; }
function catName(id){ const c = CATEGORIES.find(c=>c.id===id); return c ? c.name[lang] : ""; }
function catIcon(id){ const c = CATEGORIES.find(c=>c.id===id); return c ? c.icon : ""; }
function initials(name){ return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||"").join(""); }
function starsHtml(rating){
  const full = Math.round(rating);
  let out = "";
  for(let i=1;i<=5;i++){ out += `<span style="color:${i<=full?'var(--amber)':'var(--border)'}">★</span>`; }
  return out;
}
function productDescription(p){
  const name = p.name[lang];
  if(lang==='tr') return `${name} ile kaliteyi ve uygun fiyatı bir arada yaşayın. Özenle seçilmiş kalite standartlarımızla, hızlı kargo seçenekleriyle kapınıza kadar geliyor.`;
  if(lang==='en') return `Enjoy quality and great value with ${name}. Carefully selected to meet our quality standards, delivered fast to your door.`;
  return `Profitez de la qualité et d'un excellent rapport qualité-prix avec ${name}. Sélectionné avec soin, livré rapidement chez vous.`;
}
function getSeedReviews(p){
  const templates = REVIEW_TEMPLATES[lang];
  const idxA = p.id % templates.length;
  const idxB = (p.id+2) % templates.length;
  const ratingBase = Math.round(p.rating);
  return [
    {name: templates[idxA].name, rating: ratingBase, comment: templates[idxA].comment},
    {name: templates[idxB].name, rating: Math.max(3,ratingBase-1), comment: templates[idxB].comment},
  ];
}
function formatDate(d){
  return new Date(d).toLocaleDateString(lang==='tr'?'tr-TR':lang==='fr'?'fr-FR':'en-US', {year:'numeric', month:'short', day:'numeric'});
}

/* ================= auth modal ================= */
function openAuthModal(t){
  authTab = t || "login";
  document.getElementById("authError").classList.remove("show");
  document.getElementById("authForm").reset();
  updateAuthTabUI();
  document.getElementById("authModal").classList.add("open");
  document.getElementById("overlay").classList.add("open");
}
function closeAuthModalFn(){
  document.getElementById("authModal").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
}
function updateAuthTabUI(){
  document.getElementById("authModalTitle").textContent = authTab === "login" ? tr("loginTitle") : tr("registerTitle");
  document.getElementById("tabLogin").classList.toggle("active", authTab === "login");
  document.getElementById("tabRegister").classList.toggle("active", authTab === "register");
  document.getElementById("nameField").style.display = authTab === "register" ? "block" : "none";
  document.getElementById("authSubmitBtn").textContent = authTab === "login" ? tr("loginBtn") : tr("registerBtn");
  document.getElementById("authError").classList.remove("show");
}
document.getElementById("tabLogin").onclick = () => { authTab="login"; updateAuthTabUI(); };
document.getElementById("tabRegister").onclick = () => { authTab="register"; updateAuthTabUI(); };
document.getElementById("closeAuthModal").onclick = closeAuthModalFn;

document.getElementById("authForm").addEventListener("submit",(e)=>{
  e.preventDefault();
  const name = document.getElementById("inputName").value.trim();
  const email = document.getElementById("inputEmail").value.trim().toLowerCase();
  const password = document.getElementById("inputPassword").value;
  const errEl = document.getElementById("authError");

  if(authTab === "register"){
    if(!name || !email || !password){ errEl.textContent = tr("errFillAll"); errEl.classList.add("show"); return; }
    if(users.some(u=>u.email===email)){ errEl.textContent = tr("errEmailTaken"); errEl.classList.add("show"); return; }
    const newUser = { id: Date.now(), name, email, password, createdAt: new Date().toISOString() };
    users.push(newUser);
    currentUser = { id:newUser.id, name:newUser.name, email:newUser.email };
    closeAuthModalFn();
    afterLoginContinue();
  } else {
    if(!email || !password){ errEl.textContent = tr("errFillAll"); errEl.classList.add("show"); return; }
    const match = users.find(u=>u.email===email && u.password===password);
    if(!match){ errEl.textContent = tr("errInvalidCred"); errEl.classList.add("show"); return; }
    currentUser = { id:match.id, name:match.name, email:match.email };
    closeAuthModalFn();
    afterLoginContinue();
  }
});

function afterLoginContinue(){
  if(pendingCheckoutAfterLogin){ pendingCheckoutAfterLogin = false; currentView = "checkout"; checkoutStep = 1; }
  renderAll();
}

document.getElementById("accountForm").addEventListener("submit",(e)=>{
  e.preventDefault();
  const name = document.getElementById("editName").value.trim();
  const email = document.getElementById("editEmail").value.trim().toLowerCase();
  const newPassword = document.getElementById("editPassword").value;
  const errEl = document.getElementById("accountError");
  const okEl = document.getElementById("accountSuccess");
  errEl.classList.remove("show"); okEl.classList.remove("show");

  if(!name || !email){ errEl.textContent = tr("errFillAll"); errEl.classList.add("show"); return; }
  const emailTaken = users.some(u=>u.email===email && u.id!==currentUser.id);
  if(emailTaken){ errEl.textContent = tr("errEmailTaken"); errEl.classList.add("show"); return; }
  const userRecord = users.find(u=>u.id===currentUser.id);
  userRecord.name = name; userRecord.email = email;
  if(newPassword) userRecord.password = newPassword;
  currentUser = { id:userRecord.id, name:userRecord.name, email:userRecord.email };
  okEl.textContent = tr("accountUpdated"); okEl.classList.add("show");
  renderAccountArea();
});

/* ================= product card ================= */
function thumbHtml(p, size){
  const s = size || 34;
  const blobSize = Math.round(s * 2.1);
  return `<div class="thumb" style="background:linear-gradient(160deg, ${p.color}, var(--surface));position:relative;overflow:hidden;">
    <div style="position:absolute;width:${blobSize}px;height:${blobSize}px;border-radius:42% 58% 60% 40% / 45% 40% 60% 55%;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.65), rgba(255,255,255,0) 70%), ${p.color};opacity:0.55;"></div>
    <div style="position:absolute;width:${Math.round(s*0.4)}px;height:${Math.round(s*0.4)}px;border-radius:50%;background:#fff;opacity:0.5;top:18%;right:20%;"></div>
    <i data-lucide="${p.icon}" style="width:${s}px;height:${s}px;color:var(--navy);opacity:0.85;position:relative;z-index:1;"></i>
  </div>`;
}

function productCard(p){
  const qty = cart[p.id] || 0;
  const isFav = !!favorites[p.id];
  const badge = p.badge ? `<span class="badge ${p.badge}">${tr(p.badge)}</span>` : "";
  const outOfStock = p.stock <= 0;
  const lowStock = p.stock > 0 && p.stock <= 5;
  return `
    <div class="card">
      ${badge}
      <button class="fav-btn ${isFav?'active':''}" data-fav="${p.id}"><i data-lucide="heart" style="width:15px;height:15px;color:${isFav?'#B23A3A':'var(--muted)'}" ${isFav?'fill="#B23A3A"':''}></i></button>
      <div class="card-clickable" data-open="${p.id}">
        ${thumbHtml(p, 40)}
        <div class="pname">${p.name[lang]}</div>
        <div class="rating"><span class="star">★</span> ${p.rating} (${p.reviews})</div>
      </div>
      <div class="price">${formatPrice(p.priceTRY)}</div>
      ${outOfStock ? `<div class="stock-note out">${tr("outOfStock")}</div>` : lowStock ? `<div class="stock-note low">${tr("stockLow")}: ${p.stock}</div>` : ""}
      ${outOfStock
        ? `<button class="btn-add" disabled style="opacity:0.5;cursor:not-allowed;">${tr("outOfStock")}</button>`
        : qty === 0
        ? `<button class="btn-add" data-add="${p.id}">${tr("addToCart")}</button>`
        : `<div class="qty-row">
             <button data-minus="${p.id}"><i data-lucide="minus" style="width:15px;height:15px;color:var(--navy)"></i></button>
             <span>${qty}</span>
             <button data-plus="${p.id}"><i data-lucide="plus" style="width:15px;height:15px;color:var(--navy)"></i></button>
           </div>`
      }
    </div>
  `;
}

function bindProductEvents(container){
  container.querySelectorAll("[data-add]").forEach(btn=>{ btn.onclick = () => addToCart(Number(btn.dataset.add)); });
  container.querySelectorAll("[data-minus]").forEach(btn=>{ btn.onclick = () => changeQty(Number(btn.dataset.minus), -1); });
  container.querySelectorAll("[data-plus]").forEach(btn=>{ btn.onclick = () => changeQty(Number(btn.dataset.plus), 1); });
  container.querySelectorAll("[data-fav]").forEach(btn=>{ btn.onclick = () => toggleFavorite(Number(btn.dataset.fav)); });
  container.querySelectorAll("[data-open]").forEach(el=>{ el.onclick = () => openProduct(Number(el.dataset.open)); });
}
function toggleFavorite(id){
  if(favorites[id]){ delete favorites[id]; showToast(tr("toastFavRemoved"),"heart"); }
  else { favorites[id] = true; showToast(tr("toastFavAdded"),"heart"); }
  renderAll();
}
function openProduct(id){ selectedProductId = id; currentView = "product"; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ================= filter/sort ================= */
function applyFilterSort(list){
  let out = list.filter(p => p.rating >= minRating);
  if(sortMode === "price-asc") out = [...out].sort((a,b)=>a.priceTRY-b.priceTRY);
  else if(sortMode === "price-desc") out = [...out].sort((a,b)=>b.priceTRY-a.priceTRY);
  else if(sortMode === "rating-desc") out = [...out].sort((a,b)=>b.rating-a.rating);
  return out;
}
function filterBarHtml(){
  return `
    <div class="filter-bar">
      <div class="filter-group"><label>${tr("filterRating")}</label>
        <select id="ratingFilterSelect">
          <option value="0" ${minRating===0?'selected':''}>${tr("allRatings")}</option>
          <option value="4" ${minRating===4?'selected':''}>4★+</option>
          <option value="4.5" ${minRating===4.5?'selected':''}>4.5★+</option>
        </select>
      </div>
      <div class="filter-group"><label>${tr("sortBy")}</label>
        <select id="sortSelect">
          <option value="default" ${sortMode==='default'?'selected':''}>${tr("sortDefault")}</option>
          <option value="price-asc" ${sortMode==='price-asc'?'selected':''}>${tr("sortPriceAsc")}</option>
          <option value="price-desc" ${sortMode==='price-desc'?'selected':''}>${tr("sortPriceDesc")}</option>
          <option value="rating-desc" ${sortMode==='rating-desc'?'selected':''}>${tr("sortRatingDesc")}</option>
        </select>
      </div>
    </div>
  `;
}
function bindFilterBar(){
  const rSel = document.getElementById("ratingFilterSelect");
  const sSel = document.getElementById("sortSelect");
  if(rSel) rSel.onchange = (e) => { minRating = parseFloat(e.target.value); renderMain(); };
  if(sSel) sSel.onchange = (e) => { sortMode = e.target.value; renderMain(); };
}

/* ================= main router ================= */
function renderMain(){
  const main = document.getElementById("mainContent");
  document.body.classList.toggle("admin-mode", currentView === "admin" || currentView === "owner");

  if(currentView === "admin"){ renderAdminPage(main); return; }
  if(currentView === "owner"){ renderOwnerPage(main); return; }
  if(currentView === "product"){ renderProductPage(main); return; }
  if(currentView === "checkout"){ renderCheckoutPage(main); return; }
  if(currentView === "orders"){ renderOrdersPage(main); return; }
  if(currentView === "favorites"){ renderFavoritesPage(main); return; }

  if(query.trim() !== ""){
    let results = PRODUCTS.filter(p => p.name[lang].toLowerCase().includes(query.toLowerCase()));
    results = applyFilterSort(results);
    main.innerHTML = `
      <div class="section-head"><h2>"${query}" ${tr("searchResultsFor")}</h2><span class="count">${results.length} ${tr("productsWord")}</span></div>
      ${filterBarHtml()}
      ${results.length === 0 ? `<div class="empty-state">${tr("noResults")}</div>` : `<div class="grid">${results.map(productCard).join("")}</div>`}
    `;
    bindFilterBar(); bindProductEvents(main);
    if(window.lucide) lucide.createIcons();
    return;
  }

  if(activeCat !== "all"){
    let list = PRODUCTS.filter(p => p.cat === activeCat);
    list = applyFilterSort(list);
    main.innerHTML = `
      <div class="breadcrumb"><span data-home>${tr("allCategories")}</span> / ${catName(activeCat)}</div>
      <div class="section-head"><h2>${catIcon(activeCat)} ${catName(activeCat)}</h2><span class="count">${list.length} ${tr("productsWord")}</span></div>
      ${filterBarHtml()}
      <div class="grid">${list.map(productCard).join("")}</div>
    `;
    main.querySelector("[data-home]").onclick = () => { activeCat = "all"; currentView="home"; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    bindFilterBar(); bindProductEvents(main);
    if(window.lucide) lucide.createIcons();
    return;
  }

  renderHomePage(main);
}

/* ================= product detail page ================= */
function renderProductPage(main){
  const p = PRODUCTS.find(pr=>pr.id===selectedProductId);
  if(!p){ currentView="home"; renderMain(); return; }
  const qty = cart[p.id] || 0;
  const isFav = !!favorites[p.id];
  const related = PRODUCTS.filter(x=>x.cat===p.cat && x.id!==p.id).slice(0,4);
  const userReviews = reviews[p.id] || [];
  const allReviews = [...getSeedReviews(p), ...userReviews];

  main.innerHTML = `
    <div class="breadcrumb"><span data-home>${tr("allCategories")}</span> / <span data-cat="${p.cat}">${catName(p.cat)}</span> / ${p.name[lang]}</div>
    <div class="product-detail">
      <div class="product-detail-media">${thumbHtml(p, 100)}</div>
      <div class="product-detail-info">
        <h1>${p.name[lang]}</h1>
        <div class="rating">${starsHtml(p.rating)} <span style="margin-left:6px;">${p.rating} (${p.reviews} ${tr("reviewsWord")})</span></div>
        <div class="price-lg">${formatPrice(p.priceTRY)}</div>
        <p class="desc">${productDescription(p)}</p>
        <div class="qty-selector-row">
          <div class="qty-stepper">
            <button id="detailMinus"><i data-lucide="minus" style="width:16px;height:16px;color:var(--navy)"></i></button>
            <span id="detailQty">${qty > 0 ? qty : 1}</span>
            <button id="detailPlus"><i data-lucide="plus" style="width:16px;height:16px;color:var(--navy)"></i></button>
          </div>
          <button class="detail-add-btn" id="detailAddBtn">${tr("addToCart")}</button>
          <button class="detail-fav-btn ${isFav?'active':''}" id="detailFavBtn"><i data-lucide="heart" style="width:16px;height:16px" ${isFav?'fill="#B23A3A"':''}></i> ${tr("list")}</button>
        </div>
      </div>
    </div>

    <div class="reviews-section">
      <h2>${allReviews.length} ${tr("reviewsWord")}</h2>
      ${allReviews.map(r => `
        <div class="review-item">
          <div class="rhead"><span class="rname">${r.name}</span><span class="rstars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span></div>
          <div class="rcomment">${r.comment}</div>
        </div>
      `).join("")}

      <div class="review-form">
        ${currentUser ? `
          <div style="font-weight:700;font-size:14.5px;margin-bottom:12px;">${tr("writeReview")}</div>
          <div class="field-hint" style="margin-bottom:6px;font-weight:600;color:var(--text);">${tr("yourRating")}</div>
          <div class="star-picker" id="starPicker">${[1,2,3,4,5].map(n=>`<span data-star="${n}" class="${n<=reviewDraftRating?'filled':''}">★</span>`).join("")}</div>
          <textarea id="reviewComment" placeholder="${tr('yourComment')}"></textarea>
          <button class="submit-btn" id="submitReviewBtn">${tr("submitReview")}</button>
        ` : `
          <div class="login-prompt"><span>${tr("loginToReview")}</span><button id="reviewLoginBtn">${tr("loginBtnShort")}</button></div>
        `}
      </div>
    </div>

    ${related.length > 0 ? `
      <div class="cat-section">
        <div class="cat-section-head"><div class="heading"><div class="emoji-badge">${catIcon(p.cat)}</div><h2>${tr("relatedProducts")}</h2></div></div>
        <div class="hscroll">${related.map(productCard).join("")}</div>
      </div>
    ` : ""}
  `;

  main.querySelector("[data-home]").onclick = () => { currentView="home"; activeCat="all"; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
  main.querySelector("[data-cat]").onclick = () => { currentView="category"; activeCat=p.cat; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };

  let detailQtyVal = qty > 0 ? qty : 1;
  document.getElementById("detailMinus").onclick = () => { detailQtyVal = Math.max(1, detailQtyVal-1); document.getElementById("detailQty").textContent = detailQtyVal; };
  document.getElementById("detailPlus").onclick = () => { detailQtyVal += 1; document.getElementById("detailQty").textContent = detailQtyVal; };
  document.getElementById("detailAddBtn").onclick = () => { cart[p.id] = detailQtyVal; showToast(tr("toastAddedToCart"),"shopping-cart"); renderAll(); };
  document.getElementById("detailFavBtn").onclick = () => toggleFavorite(p.id);

  if(currentUser){
    document.querySelectorAll("#starPicker [data-star]").forEach(star=>{ star.onclick = () => { reviewDraftRating = Number(star.dataset.star); renderMain(); }; });
    document.getElementById("submitReviewBtn").onclick = () => {
      const comment = document.getElementById("reviewComment").value.trim();
      if(!comment) return;
      if(!reviews[p.id]) reviews[p.id] = [];

      showToast(tr("toastReviewAdded"),"star");
      renderMain();

    const loginBtn = document.getElementById("reviewLoginBtn");
    if(loginBtn) loginBtn.onclick = () => openAuthModal("login");

  bindProductEvents(main);
  if(window.lucide) lucide.createIcons();

/* ================= checkout ================= */
function stepDot(n, label){
  const cls = checkoutStep === n ? "active" : checkoutStep > n ? "done" : "";
  return `<div class="step-dot ${cls}"><div class="num">${checkoutStep > n ? "✓" : n}</div><span>${label}</span></div>`;
}
function checkoutSummaryHtml(){
  const entries = Object.entries(cart).filter(([,q])=>q>0);
  const shippingFeeTRY = checkoutData.shipping === "express" ? 39.9 : 0;
  const discountTRY = appliedCoupon ? cartTotalTRY() * (appliedCoupon.percent/100) : 0;
  const total = cartTotalTRY() + shippingFeeTRY - discountTRY;
  return `
    <div class="checkout-summary">
      <h3>${tr("orderSummary")}</h3>
      ${entries.map(([id,qty])=>{
        const p = PRODUCTS.find(pr=>pr.id===Number(id));
        return `<div class="summary-item"><span>${p.name[lang]} × ${qty}</span><span>${formatPrice(p.priceTRY*qty)}</span></div>`;
      }).join("")}
      <div class="summary-row"><span>${tr("subtotal")}</span><span>${formatPrice(cartTotalTRY())}</span></div>
      <div class="summary-row"><span>${tr("shipping")}</span><span>${shippingFeeTRY === 0 ? tr("shippingFree") : formatPrice(shippingFeeTRY)}</span></div>
      ${appliedCoupon ? `<div class="summary-row" style="color:var(--green);"><span>${tr("couponLbl")} (${appliedCoupon.code})</span><span>-${formatPrice(discountTRY)}</span></div>` : ""}
      <div class="coupon-row">
        ${appliedCoupon
          ? `<div class="coupon-applied"><i data-lucide="tag" style="width:14px;height:14px"></i> ${appliedCoupon.code} (%${appliedCoupon.percent}) <button id="removeCouponBtn">${tr("removeItem")}</button></div>`
          : `<input type="text" id="couponInput" placeholder="${tr('couponPlaceholder')}"><button id="applyCouponBtn">${tr("applyCoupon")}</button>`
        }
      </div>
      ${couponError ? `<div class="field-hint" style="color:var(--red);margin-top:6px;">${couponError}</div>` : ""}
      <div class="summary-total"><span>${tr("totalLbl")}</span><span>${formatPrice(total)}</span></div>
    </div>
  `;
}
function bindCouponControls(){
  const applyBtn = document.getElementById("applyCouponBtn");
  const removeBtn = document.getElementById("removeCouponBtn");
  if(applyBtn){
    applyBtn.onclick = () => {
      const code = document.getElementById("couponInput").value.trim().toUpperCase();
      const found = coupons.find(c=>c.code===code && c.active);
      if(!found){ couponError = tr("couponInvalid"); renderMain(); return; }
      appliedCoupon = found; couponError = "";
      showToast(tr("toastCouponApplied"), "tag");
      renderMain();
    };
  }
  if(removeBtn){ removeBtn.onclick = () => { appliedCoupon = null; renderMain(); }; }
}

    };

      if(!checkoutData.cardName || checkoutData.cardNumber.replace(/\s/g,"").length < 12 || !checkoutData.expiry || !checkoutData.cvc){
        err.textContent = tr("errFillAll"); err.classList.add("show"); return;
      }
      placeOrder();
    };

function placeOrder(){
  const items = Object.entries(cart).filter(([,q])=>q>0).map(([id,qty])=>{
    const p = PRODUCTS.find(pr=>pr.id===Number(id));
    return { id:p.id, name:p.name[lang], qty, priceTRY:p.priceTRY };
  });
  items.forEach(it=>{
    const p = PRODUCTS.find(pr=>pr.id===it.id);
    if(p) p.stock = Math.max(0, p.stock - it.qty);
  });
  const shippingFeeTRY = checkoutData.shipping === "express" ? 39.9 : 0;
  const discountTRY = appliedCoupon ? cartTotalTRY() * (appliedCoupon.percent/100) : 0;
  const order = {
    id: "PZ" + Date.now().toString().slice(-8),
    date: new Date().toISOString(),
    items,
    totalTRY: cartTotalTRY() + shippingFeeTRY - discountTRY,
    couponCode: appliedCoupon ? appliedCoupon.code : null,
    status: "preparing",
    userEmail: currentUser.email,
    userName: currentUser.name,
  };
  orders.push(order);
  lastOrder = order;
  cart = {};
  appliedCoupon = null;
  couponError = "";
  checkoutStep = 4;
  renderAll();
}

          <option value="bestSeller" ${p.badge==='bestSeller'?'selected':''}>${tr("bestSeller")}</option>
        </select>
      </div>
      <div class="checkout-actions">
        <button class="btn-secondary" id="pfCancel">${tr("cancelBtn")}</button>

function bindProductForm(existingId){
  document.getElementById("pfCancel").onclick = () => { ownerProductFormMode = null; renderMain(); };
  document.getElementById("pfSave").onclick = () => {
    const name = document.getElementById("pfName").value.trim();
    const cat = document.getElementById("pfCat").value;
    const icon = document.getElementById("pfIcon").value;
    const priceTRY = parseFloat(document.getElementById("pfPrice").value) || 0;
    const stock = parseInt(document.getElementById("pfStock").value) || 0;
    const badge = document.getElementById("pfBadge").value || null;
    if(!name) return;
    const PALETTE = ["#EDE6C8","#DCE4EC","#EAE0E6","#E9DACF","#E6DCEA","#DFEBDF","#DCE7DE","#F2DFC7"];
    if(existingId){
      const p = PRODUCTS.find(pr=>pr.id===existingId);
      p.name = { tr:name, en:name, fr:name };
      p.cat = cat; p.icon = icon; p.priceTRY = priceTRY; p.stock = stock; p.badge = badge;
      showToast(tr("productUpdated"), "check-circle");
    } else {
      const newId = Math.max(...PRODUCTS.map(p=>p.id)) + 1;
      PRODUCTS.push({
        id:newId, cat, priceTRY, rating:0, reviews:0, badge, stock, icon,
        color: PALETTE[newId % PALETTE.length],
        name:{ tr:name, en:name, fr:name },
      });
      showToast(tr("productAdded"), "check-circle");
    }
    ownerProductFormMode = null;
    renderMain();
  };
}

function salesChartHtml(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    days.push(d);
  }
  const dayTotals = days.map(d=>{
    const key = d.toDateString();
    const total = orders.filter(o=>new Date(o.date).toDateString()===key).reduce((s,o)=>s+o.totalTRY,0);
    return { label: d.toLocaleDateString(lang==='tr'?'tr-TR':lang==='fr'?'fr-FR':'en-US',{weekday:'short'}), total };
  });
  const max = Math.max(...dayTotals.map(d=>d.total), 1);
  const hasData = orders.length > 0;
  return `
    <div class="checkout-panel">
      <h2>${tr("salesChartTitle")} · ${tr("last7Days")}</h2>
      ${!hasData ? `<div class="admin-empty">${tr("noSalesData")}</div>` : `
        <div style="display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px;">
          ${dayTotals.map(d=>`
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;">
              <div style="font-size:11px;color:var(--muted);">${d.total > 0 ? formatPrice(d.total) : ""}</div>
              <div style="width:100%;max-width:34px;background:linear-gradient(180deg,var(--amber),var(--amber-dark));border-radius:6px 6px 0 0;height:${Math.max(4, (d.total/max)*130)}px;"></div>
              <div style="font-size:11px;color:var(--muted);text-transform:capitalize;">${d.label}</div>
            </div>
          `).join("")}
        </div>
      `}
    </div>
  `;
}

/* ================= cart ================= */
function cartCount(){ return Object.values(cart).reduce((s,q)=>s+q,0); }
function cartTotalTRY(){
  return Object.entries(cart).reduce((sum,[id,qty])=>{
    const p = PRODUCTS.find(pr=>pr.id===Number(id));
    return sum + (p ? p.priceTRY*qty : 0);
  },0);
}
function addToCart(id){
  const p = PRODUCTS.find(pr=>pr.id===id);
  if(p && p.stock <= 0) return;
  cart[id] = (cart[id]||0)+1;
  showToast(tr("toastAddedToCart"),"shopping-cart"); renderAll();
}
function changeQty(id, delta){
  const p = PRODUCTS.find(pr=>pr.id===id);
  const max = p ? p.stock : 999;
  cart[id] = Math.max(0, Math.min(max, (cart[id]||0)+delta));
  renderAll();
}
function removeFromCart(id){ cart[id] = 0; renderAll(); }
function renderCartBadge(){ document.getElementById("cartBadge").textContent = cartCount(); }

function renderDrawer(){
  const body = document.getElementById("drawerBody");
  const footer = document.getElementById("drawerFooter");
  const entries = Object.entries(cart).filter(([,q])=>q>0);
  document.getElementById("drawerTitle").textContent = `${tr("cartTitle")} (${cartCount()})`;

  if(entries.length === 0){
    body.innerHTML = `
      <div class="empty-state">
        <i data-lucide="shopping-cart" style="width:42px;height:42px;opacity:0.35"></i>
        <div style="font-weight:700;margin:10px 0 4px;color:var(--text);">${tr("cartEmpty")}</div>
        <div style="font-size:13px;">${tr("cartEmptySub")}</div>
      </div>
    `;
    footer.style.display = "none";
  } else {
    body.innerHTML = entries.map(([id,qty])=>{
      const p = PRODUCTS.find(pr=>pr.id===Number(id));
      return `
        <div class="cart-row">
          <div class="thumb-sm" style="background:linear-gradient(160deg, ${p.color}, var(--surface))"><i data-lucide="${p.icon}" style="width:22px;height:22px;color:var(--navy);opacity:0.75"></i></div>
          <div style="flex:1;min-width:0;">
            <div class="cname">${p.name[lang]}</div>
            <div class="cprice">${formatPrice(p.priceTRY)}</div>
            <div class="cart-controls">
              <div class="qty-mini">
                <button data-dminus="${p.id}"><i data-lucide="minus" style="width:13px;height:13px;color:var(--navy)"></i></button>
                <span style="font-size:13px;font-weight:700;min-width:14px;text-align:center;">${qty}</span>
                <button data-dplus="${p.id}"><i data-lucide="plus" style="width:13px;height:13px;color:var(--navy)"></i></button>
              </div>
              <button class="remove-btn" data-remove="${p.id}"><i data-lucide="trash-2" style="width:13px;height:13px"></i> ${tr("removeItem")}</button>
            </div>
          </div>
        </div>
      `;
    }).join("");
    footer.style.display = "block";
    document.getElementById("cartSubtotal").textContent = formatPrice(cartTotalTRY());
    body.querySelectorAll("[data-dminus]").forEach(btn=>btn.onclick=()=>changeQty(Number(btn.dataset.dminus),-1));
    body.querySelectorAll("[data-dplus]").forEach(btn=>btn.onclick=()=>changeQty(Number(btn.dataset.dplus),1));
    body.querySelectorAll("[data-remove]").forEach(btn=>btn.onclick=()=>removeFromCart(Number(btn.dataset.remove)));
  }
  if(window.lucide) lucide.createIcons();
}

/* ================= master render ================= */
function renderAll(){
  renderStaticText();
  renderCategoryNav();
  renderSideDrawer();
  renderMain();
  renderCartBadge();
  renderDrawer();
  renderAccountArea();
  renderAccountMenu();
  if(window.lucide) lucide.createIcons();
}

/* ================= global events ================= */
document.getElementById("langBtn").onclick = () => document.getElementById("langMenu").classList.toggle("open");
document.querySelectorAll(".lang-item").forEach(item=>{
  item.onclick = () => { lang = item.dataset.lang; document.getElementById("langMenu").classList.remove("open"); renderAll(); };
});
document.addEventListener("click",(e)=>{
  const langBox = document.querySelector(".lang");
  if(langBox && !langBox.contains(e.target)) document.getElementById("langMenu").classList.remove("open");
});

document.getElementById("searchInput").addEventListener("input",(e)=>{
  query = e.target.value;
  if(query.trim() !== "") currentView = "search"; else currentView = activeCat === "all" ? "home" : "category";
  renderMain();
});

document.getElementById("logoHome").onclick = () => { activeCat="all"; query=""; currentView="home"; document.getElementById("searchInput").value=""; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };

document.getElementById("menuBtn").onclick = openSideDrawer;
document.getElementById("closeSideDrawer").onclick = closeSideDrawer;

document.getElementById("cartOpenBtn").onclick = () => {
  document.getElementById("overlay").classList.add("open");
  document.getElementById("drawer").classList.add("open");
};
document.getElementById("closeDrawer").onclick = closeCartDrawer;
function closeCartDrawer(){
  document.getElementById("drawer").classList.remove("open");
  if(!document.getElementById("sideDrawer").classList.contains("open")) document.getElementById("overlay").classList.remove("open");
}
document.getElementById("continueBtn").onclick = closeCartDrawer;

document.getElementById("checkoutBtn").onclick = () => {
  if(cartCount() === 0) return;
  closeCartDrawer();
  if(!currentUser){ pendingCheckoutAfterLogin = true; openAuthModal("login"); return; }
  currentView = "checkout"; checkoutStep = 1;
  renderAll();
  window.scrollTo({top:0,behavior:"smooth"});
};

document.getElementById("newsletterBtn").onclick = () => {
  const email = document.getElementById("newsletterEmail").value.trim();
  if(!email) return;
  document.getElementById("newsletterEmail").value = "";
  showToast(tr("toastSubscribed"),"mail-check");
};

document.getElementById("overlay").onclick = () => {
  closeCartDrawer(); closeSideDrawer(); closeAuthModalFn(); closeAccountModalFn(); closeAdminLoginModalFn(); closeSupportModalFn(); closeOwnerLoginModalFn();
};

/* ================= init ================= */
applyTheme();
renderAll();
